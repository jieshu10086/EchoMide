# ============================================================================
# EchoMind 前端 —— 纯 nginx 托管 dist 静态文件的配置（非 Docker 方案）
#
# 放置位置（Debian / Ubuntu 系）：/etc/nginx/conf.d/echomind.conf
#   sudo cp deploy/nginx-static.conf /etc/nginx/conf.d/echomind.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 需要按你的实际情况改三处，都标了 ★
# ============================================================================

server {
    listen 80;
    # ★ 1/3 改成你的域名或公网 IP；只想用 IP 访问就写 IP，或保留 _
    server_name _;

    # ★ 2/3 dist 内容上传到哪个目录就写哪个
    root /var/www/echomind;
    index index.html;

    client_max_body_size 10M;

    # Vite 产物文件名带内容 hash，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 绝不能缓存，否则发版后用户还拿着旧的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # SPA 兜底：刷新子路径不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------------
    # Python 后端反向代理
    #
    # 前端产物里 API 地址是构建期写死的 /api/python（见 src/lib/backends.js），
    # 所以这段是必须的：没有它页面能打开，但会一直显示"服务未连接"，发消息全部失败。
    #
    # proxy_pass 结尾的斜杠很关键，作用是剥掉 /api/python 前缀：
    #   /api/python/health       -> http://127.0.0.1:8000/health
    #   /api/python/chat/stream  -> http://127.0.0.1:8000/chat/stream
    # 漏掉结尾的斜杠会变成 /api/python/chat，后端直接 404。
    # ------------------------------------------------------------------------
    location /api/python/ {
        # ★ 3/3 后端地址：同机就是 127.0.0.1:8000；后端在别的机器改成对应 IP/端口
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE（流式输出）必需的几行 ----
        # 不关缓冲的话 nginx 会把整个 SSE 流攒完才吐给浏览器，
        # 界面上的打字机效果会消失、变成"卡很久然后整段蹦出来"。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # LLM 首字偶发变慢，读超时给宽一点，避免长回答被中途截断
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
